[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "drivememory"
version = "0.1.0"
description = "Context-aware memory system for an in-car AI assistant: vehicle signals -> explainable driver memory -> personalised, agentic experiences (MCP + A2A)."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
keywords = ["llm", "agents", "mcp", "a2a", "memory", "automotive", "personalization", "context-engineering"]
dependencies = [
    "numpy>=1.26",
    "pydantic>=2.5",
]

[project.optional-dependencies]
api = ["fastapi>=0.110", "uvicorn[standard]>=0.27", "strawberry-graphql>=0.220", "mangum>=0.17"]
mcp = ["mcp>=1.2"]
llm = ["anthropic>=0.40"]
eval = ["matplotlib>=3.8"]
dev = ["pytest>=8", "httpx>=0.27", "ruff>=0.4"]
all = ["drivememory[api,mcp,llm,eval,dev]"]

[project.scripts]
drivememory = "drivememory.cli:main"
drivememory-memory-mcp = "drivememory.mcp_servers.memory_server:main"
drivememory-vehicle-mcp = "drivememory.mcp_servers.vehicle_server:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["B008"]
